<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="strict-origin-when-cross-origin">
	<link rel="icon" type="image/x-icon" href="gato.png">
    <title>Control de Gastos Personal</title>
    <style>
        :root {
            --primary: #2563eb;
            --background: #f8fafc;
            --surface: #ffffff;
            --text: #1e293b;
            --danger: #ef4444;
        }

        body {
 	  font-family: system-ui, -apple-system, sans-serif;
  	  background-color: var(--background);
   	  background-image: url(gato.png);
  	  background-repeat: no-repeat;
  	  background-size: cover;
  	  color: var(--text);
 	  margin: 0;
  	  width: 100%;
 	  padding: 20px;
  	  display: flex;
   	  justify-content: center;
   	  flex-direction: column;
 	  align-items: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--surface);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }

        h1 { margin-top: 0; font-size: 24px; text-align: center; }

        form {
            display: grid;
            gap: 12px;
            margin-bottom: 24px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        input {
            padding: 8px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 16px;
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            font-weight: 600;
        }

        button:hover { background-color: #1d4ed8; }

        .total-box {
            background: #eff6ff;
            padding: 12px;
            border-radius: 6px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 20px;
            border: 1px solid #bfdbfe;
        }

        ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            border-bottom: 1px solid #e2e8f0;
        }

        .btn-delete {
            background-color: var(--danger);
            padding: 6px 10px;
            font-size: 12px;
        }
        .btn-delete:hover { background-color: #dc2626; }
        
        .gasto-info {
            display: flex;
            gap: 12px;
        }
        .gasto-fecha { color: #64748b; font-size: 14px; }

	.vid {
	text-align: center; margin-top: 20px; width: 100%;
	border-radius: 12px;
	}
	iframe{
	border-radius: 12px;
	}
    </style>
</head>
<body>

<div class="container">
    <h1>Control de Gastos</h1>
    
    <!-- Formulario para crear nuevo dato -->
    <form id="gasto-form">
        <div class="input-group">
            <label for="fecha">Fecha</label>
            <input type="date" id="fecha" required>
        </div>
        <div class="input-group">
            <label for="concepto">Concepto</label>
            <input type="text" id="concepto" placeholder="Ej. Supermercado" required>
        </div>
        <div class="input-group">
            <label for="monto">Monto ($)</label>
            <input type="number" id="monto" step="0.01" placeholder="0.00" required>
        </div>
        <button type="submit">Agregar Gasto</button>
    </form>

    <div class="total-box">
        Total Acumulado: $<span id="total-general">0.00</span>
    </div>

    <!-- Lista donde se muestran y eliminan los datos -->
    <ul id="lista-gastos"></ul>
</div>


<script>
    // Elementos del DOM
    const form = document.getElementById('gasto-form');
    const listaGastos = document.getElementById('lista-gastos');
    const totalGeneral = document.getElementById('total-general');

    // Cargar datos de la memoria de la computadora (localStorage) al iniciar
    let gastos = JSON.parse(localStorage.getItem('mis_gastos')) || [];

    // Función para renderizar los datos en la pantalla
    function mostrarGastos() {
        listaGastos.innerHTML = '';
        let total = 0;

        // Ordenar gastos por fecha de forma descendente
        gastos.sort((a, b) => new Date(b.fecha) - new Date(a.fecha));

        gastos.forEach((gasto, index) => {
            total += parseFloat(gasto.monto);

            const li = document.createElement('li');
            li.innerHTML = `
                <div class="gasto-info">
                    <span class="gasto-fecha">${gasto.fecha}</span>
                    <strong>${gasto.concepto}</strong>
                </div>
                <div>
                    <span>$${parseFloat(gasto.monto).toFixed(2)}</span>
                    <button class="btn-delete" onclick="eliminarGasto(${index})">Eliminar</button>
                </div>


            `;
            listaGastos.appendChild(li);
        });

        totalGeneral.textContent = total.toFixed(2);
    }

    // Función para CREAR un nuevo dato
    form.addEventListener('submit', (e) => {
        e.preventDefault();

        const nuevoGasto = {
            fecha: document.getElementById('fecha').value,
            concepto: document.getElementById('concepto').value,
            monto: document.getElementById('monto').value
        };

        gastos.push(nuevoGasto);
        
        // Guardar en la memoria de la computadora
        localStorage.setItem('mis_gastos', JSON.stringify(gastos));

        form.reset();
        mostrarGastos();
    });

    // Función para ELIMINAR un dato
    window.eliminarGasto = function(index) {
        gastos.splice(index, 1); // Quita el elemento del arreglo
        
        // Actualiza la memoria de la computadora
        localStorage.setItem('mis_gastos', JSON.stringify(gastos));
        
        mostrarGastos();
    };

    // Carga inicial al abrir la página
    mostrarGastos();
</script>
<div class="vid">
<iframe 
  width="560"
  height="315" 
  src="https://www.youtube.com/embed/xS34-aK7yH4?si=AKr9E5OqtFmgRfhz" 
title="YouTube video player" 
frameborder="0" 
allow="accelerometer; 
autoplay; 
clipboard-write; 
encrypted-media;
 gyroscope; 
picture-in-picture;
 web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
</div>
</body>
</html>
